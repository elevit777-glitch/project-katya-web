<script>
const doors=[['Пути и возможности','Здесь мы исследуем возможные маршруты. Не нужно выбирать один путь на всю жизнь.','Какой вариант ты пока не рассматривала — просто потому, что он казался слишком необычным?'],['Познание','Знания, навыки и исследования, которые хочется освоить. Учёба ради понимания.','Что тебе хочется понять настолько хорошо, чтобы суметь объяснить это своими словами?'],['Интересы','Место для тем, к которым хочется возвращаться. Любопытству не обязательно оправдывать себя пользой.','Какой вопрос ты бы исследовала, даже если за ответ не дадут ни денег, ни диплома?'],['Мастерская','Смелые идеи и маленькие опыты. Здесь можно попробовать, удивиться и передумать.','Как проверить одну интересную гипотезу за час, используя то, что уже под рукой?'],['Ресурсы','Наши опоры: уже имеющиеся навыки, опыт, инструменты и доступные возможности.','Что ты уже умеешь, но редко считаешь своим преимуществом?']];
const ideas=['Выбери две далёкие друг от друга темы. Что интересного может возникнуть на их пересечении?','Найди один вопрос, на который тебе действительно хочется узнать ответ. Сегодня достаточно самого вопроса.','Представь, что твоё любимое занятие стало исследовательской экспедицией. С чего бы она началась?','Возьми идею, которая кажется слишком большой. Как выглядел бы её крошечный пробный вариант?','Какой навык ты используешь настолько легко, что перестала его замечать?','Открой знакомую тему с непривычной стороны: через историю, устройство или взгляд другого человека.','Если бы можно было открыть сегодня только одну дверь, за какой тебя ждало бы больше любопытства?','Какую идею ты когда-то отложила — и хочешь ли ты к ней вернуться теперь?'];
const panel=document.getElementById('panel'),heading=document.getElementById('heading'),text=document.getElementById('text'),label=document.getElementById('label'),hint=document.getElementById('hint'),another=document.getElementById('another');let last=-1;
function show(){if(!panel.open)panel.showModal()}
document.querySelectorAll('[data-door]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.door),d=doors[i];label.textContent='ДВЕРЬ 0'+(i+1);heading.textContent=d[0];text.textContent=d[1];hint.textContent=d[2];another.hidden=true;document.getElementById("four-paths-link").hidden=i!==0;document.getElementById("four-paths-link").style.display=i===0?"inline-block":"none";document.getElementById("atlas-link").hidden=i!==1;document.getElementById("atlas-link").style.display=i===1?"inline-block":"none";document.getElementById("interests-link").hidden=i!==2;document.getElementById("interests-link").style.display=i===2?"inline-block":"none";document.getElementById("workshop-link").hidden=i!==3;document.getElementById("workshop-link").style.display=i===3?"inline-block":"none";show()}));
function surprise(){let n;do{n=Math.floor(Math.random()*ideas.length)}while(n===last);last=n;label.textContent='НЕЙТ ПОДБРАСЫВАЕТ ИДЕЮ';heading.textContent='А что, если…';text.textContent=ideas[n];hint.textContent='Можно просто подумать. Превращать каждую мысль в задачу необязательно.';another.hidden=false;document.getElementById("four-paths-link").hidden=true;document.getElementById("four-paths-link").style.display="none";document.getElementById("atlas-link").hidden=true;document.getElementById("atlas-link").style.display="none";document.getElementById("interests-link").hidden=true;document.getElementById("interests-link").style.display="none";document.getElementById("workshop-link").hidden=true;document.getElementById("workshop-link").style.display="none";show()}
document.querySelector('.idea').addEventListener('click',surprise);document.querySelector('.idea-mobile').addEventListener('click',surprise);another.addEventListener('click',surprise);document.querySelector('.close').addEventListener('click',()=>panel.close());panel.addEventListener('click',e=>{if(e.target===panel){const r=panel.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)panel.close()}});
</script></html>
